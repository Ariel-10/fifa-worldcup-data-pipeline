name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # CI — run dbt compile
  dbt-test:
    name: dbt tests
    runs-on: ubuntu-latest

    services:
      # temporary PostgreSQL
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: fifa_dw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # download repo in the virtual machine

      - name: Install dbt
        run: pip install dbt-core dbt-postgres -q

      - name: Run dbt compile — validate SQL syntax
        working-directory: transform
        run: dbt compile --project-dir fifa_pipeline --profiles-dir .
        env:
          POSTGRES_HOST: localhost  # GitHub Actions postgres runs on localhost

  # CD — check Streamlit Docker image builds successfully
  # production equivalent: docker push + gcloud run deploy
  docker-build:
    name: Build Streamlit image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Streamlit image
        run: docker build -t fifa-dashboard ./dashboard  # validates Dockerfile + dependencies