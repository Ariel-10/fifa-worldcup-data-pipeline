    "dbt-postgres>=1.10.0",
    "minio>=7.2.20",
    "pandas>=3.0.3",
    "plotly>=6.7.0",
    "psycopg2-binary>=2.9.12",
    "sqlalchemy>=2.0.50",
    "streamlit>=1.58.0",
]
