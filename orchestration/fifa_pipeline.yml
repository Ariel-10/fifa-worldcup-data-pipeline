id: fifa_pipeline
namespace: fifa
description: "End-to-end FIFA World Cup data pipeline — load, transform, test"

tasks:

  # STEP 1 — Clone repo to access project files
  - id: clone_repo
    type: io.kestra.plugin.git.Clone
    url: https://github.com/Ariel-10/fifa-worldcup-data-pipeline
    branch: main

  # STEP 2 — Load CSVs from MinIO in PostgreSQL
  - id: load
    type: io.kestra.plugin.scripts.python.Script
    docker:
      image: python:3.12-slim
    env:
      MINIO_HOST: minio
      MINIO_ACCESS_KEY: root
      MINIO_SECRET_KEY: rootroot
      POSTGRES_HOST: postgres
      POSTGRES_DB: fifa_dw
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    beforeCommands:
      - pip install minio pandas psycopg2-binary -q
    inputFiles:
      load.py: "{{outputs.clone_repo.outputFiles['warehouse/load.py']}}"
    script: |
      exec(open('load.py').read())

  # STEP 3 — Run dbt models
  - id: dbt_run
    type: io.kestra.plugin.scripts.shell.Commands
    docker:
      image: ghcr.io/dbt-labs/dbt-postgres:1.9.0
    inputFiles:
      profiles.yml: "{{outputs.clone_repo.outputFiles['transform/profiles.yml']}}"
    commands:
      - dbt run --project-dir transform/fifa_pipeline --profiles-dir .

  # STEP 4 — Run dbt tests
  - id: dbt_test
    type: io.kestra.plugin.scripts.shell.Commands
    docker:
      image: ghcr.io/dbt-labs/dbt-postgres:1.9.0
    inputFiles:
      profiles.yml: "{{outputs.clone_repo.outputFiles['transform/profiles.yml']}}"
    commands:
      - dbt test --project-dir transform/fifa_pipeline --profiles-dir .