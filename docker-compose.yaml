services:
  # DATA LAKE
  minio:
    image: minio/minio # latest implicit
    ports:
      - "9000:9000" # Python API
      - "9001:9001" # browser UI
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: rootroot # min 8chars
    command: server /data --console-address ":9001"
    volumes:
      - fifa_minio_data:/data

  # DATA WAREHOUSE
  postgres:
    image: postgres:16 # pinned version
    ports:
      - "5432:5432" # dbt/Python port
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: fifa_dw # auto-created
    volumes:
      - fifa_postgres_data:/var/lib/postgresql/data # don't change

  # ORCHESTRATION
  kestra:
    image: kestra/kestra:latest
    pull_policy: always # checks updates
    user: "root" # admin perms
    command: server standalone # local mode
    ports:
      - "8080:8080" # browser UI
    depends_on:
      - postgres # waits postgres
    volumes:
      - fifa_kestra_data:/app/storage # persists outputs
      - /var/run/docker.sock:/var/run/docker.sock # spawns containers
      - /tmp/kestra-wd:/tmp/kestra-wd # shared tempfiles
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/fifa_dw  
            driver-class-name: org.postgresql.Driver 
            username: root
            password: root
        kestra:
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp

  # DATABASE UI
  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    depends_on:
      - postgres

  # TRANSFORMATIONS — on-demand only (profiles: dbt)
  # GCP equivalent: dbt + Cloud Composer / Kestra
  dbt:
    build: ./transform  # builds from transform/Dockerfile
    volumes:
      - ./transform:/usr/app/dbt
    working_dir: /usr/app/dbt
    depends_on:
      - postgres
    environment:
      DBT_PROFILES_DIR: /usr/app/dbt
    profiles:
      - dbt  # run with: docker compose run dbt <command>

volumes:
  fifa_minio_data:
  fifa_postgres_data:
  fifa_kestra_data: